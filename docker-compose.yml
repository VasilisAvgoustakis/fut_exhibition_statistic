x-common-variables: &common-variables
  MYSQL_USER: ${DB_USER:-regular_user}
  MYSQL_PASSWORD: ${DB_PASSWORD:-regular_pass}
  MYSQL_DATABASE: ${DB_DATABASE:-futurium_exhibition_stats}
  REACT_APP_SERVER_PORT: ${REACT_APP_SERVER_PORT:-8000}
  REDIS_HOST: ${REDIS_HOST:-redis}

services:
  redis:
    image: redis:alpine
    container_name: redis_container
    env_file:
      - .env
    ports:
      - "6379:6379"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./redis/data:/data  # Optional: persistent storage for Redis
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
    command: redis-server --bind 0.0.0.0
    depends_on:
      mysql-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  worker:
    build: 
      context: ./redis/worker
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      mysql-db:
        condition: service_healthy
    volumes:
      - ./:/app
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    working_dir: /app/redis/worker
    container_name: worker_container
    environment:
      PYTHONPATH: /app
      REDIS_HOST: ${REDIS_HOST:-redis}
      TZ: ${TZ:-Europe/Berlin}


  # python backend 
  python_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      mysql-db:
        condition: service_healthy
    volumes:
      - ./:/app
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped
    working_dir: /app/backend
    environment:
      <<: *common-variables
      PYTHONPATH: /app
      TZ: ${TZ:-Europe/Berlin}
      #<<: *common-variables
      #REDIS_URL: "redis://redis:6379"  # Add this line if your backend interacts with Redis

  # python backend 
  flask_dash_app:
    build:
      context: ./flask_dash_app
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      mysql-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped
    working_dir: /app/flask_dash_app
    environment:
      <<: *common-variables
      PYTHONPATH: /app
      TZ: ${TZ:-Europe/Berlin}
      REDIS_URL: "redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}"  # Enable Dash app to communicate with Redis
      FLASK_ENV: ${FLASK_ENV:-development}
      FLASK_DEBUG: ${FLASK_DEBUG:-1}
    ports:
      - ${FLASK_PORT:-8050}:${FLASK_PORT:-8050}


  # mysql server
  mysql-db:
    image: mysql:8.0
    container_name: mysql_container
    env_file:
      - .env
    command: --default-authentication-plugin=mysql_native_password
    environment:
      <<: *common-variables
      MYSQL_HOST: ${DB_HOST:-mysql-db}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-toor}
      TZ: ${TZ:-Europe/Berlin}
    ports:
      - 3308:3306
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # MySQL entrypoint executes this SQL file only on a fresh datadir (i.e. when /var/lib/mysql is empty). With existing data it is ignored.
      - ./backend/db_schema/exhibition_schema.sql:/docker-entrypoint-initdb.d/exhibition_schema.sql:ro
      - /home/administrator/db/config:/etc/mysql/conf.d
      - /home/administrator/db/data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  phpmyadmin:
    depends_on:
      - mysql-db
    env_file:
      - .env
    image: phpmyadmin/phpmyadmin
    container_name: phpadmin_container
    environment:
      PMA_HOST: ${DB_HOST:-mysql-db}
    links:
      - mysql-db:mysql-db
    ports:
      - 8080:80
    restart: unless-stopped
